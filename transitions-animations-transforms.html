<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!-- This is for practice, not for the project. -->

<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Page2</a></li>
            <li><a href="#proxy">toProxy</a></li>
        </ul>
    </nav>

    <p id="transition">Transitions text here</p>
    
    <p id = "transforming">Transformed text here</p>

    <p id = "animated">Animated</p>

    <input id = "trigger" type = "checkbox">

    <p id = "proxy"> Transition thingy</p>

    <label for="trigger" id="fakebutton">Button</label>
    <!--The for="trigger" means that clicking this is the same as clicking trigger
    and vice-versa-->

    <style>
        p {
            font-size: 150%;
            margin-top:10%;
        }

        p:target{
            background-color: yellow;
        }

        html {
            scroll-behavior: smooth;
        }

        nav ul {

            list-style:none;
            display:flex;
            justify-content: space-between;
        }

        #transition {
            background-color: bisque;
            width: 100px;
            transition-duration: 2s;
        }

        #transition:hover {
            background-color: navy;
            width: 300px;
            transition-duration: 5s; 
            font-size: 30px;
            transition-timing-function: steps(8);
        }

        #transforming {
            transform: rotateX(0deg);
            background-color: red;
        }

        #transforming:hover {
            transform:rotateX(60deg);
            background-color: blue;
            transform:
                all 5s,
                transform 2s,
                background-color 4s;
        }


        #animated {
            animation: other-slide-lol;
            animation-duration: 3s;
        }

        #animated:hover {
            animation-play-state: paused;
            color: red;
        }

        #trigger:checked ~ #proxy{
            background-color: red;
        }

        @keyframes slide-in {
            from {
                transform: translateX(100%);
            }
            
            to {
                transform: translateX(0%);
            }
        }

        @keyframes other-slide-lol{
            0% {
                transform: rotate(180deg) translateX(10%);
            }
            50% {
                transform: translateX(70%);
            }
            100%{
                transform: translateX(0%);
            }
        }




    </style>
</body>
</html>
